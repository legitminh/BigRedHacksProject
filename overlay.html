<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Waypoint • Gentle reminder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/overlay.css" />
    <script type="module" src="/src/overlay.ts" defer></script>
  </head>
  <body>
    <div id="toast" class="toast" hidden role="status" aria-live="assertive">
      <div class="toast-inner">
        <div class="toast-icon" aria-hidden="true">
          <img src="/src/assets/figma/ship.svg" width="32" height="26" alt="" />
        </div>
        <div class="toast-content">
          <p class="toast-kicker">
            <span class="toast-kicker-pill">✦&nbsp;&nbsp;A gentle check-in</span>
          </p>
          <p id="toast-text" class="toast-text"></p>
        </div>
      </div>
    </div>
  </body>
</html>
