<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Waypoint • Gentle reminder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/overlay.css" />
    <script type="module" src="/src/overlay.ts" defer></script>
  </head>
  <body>
    <div id="toast" class="toast" hidden role="status" aria-live="assertive">
      <div class="toast-glow" aria-hidden="true"></div>
      <div class="toast-inner">
        <div class="toast-icon" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="14" cy="15" r="7" fill="url(#planet-fill)" />
            <ellipse cx="14" cy="15" rx="11" ry="3.5" stroke="url(#ring-stroke)" stroke-width="1.25" fill="none" transform="rotate(-18 14 15)" />
            <circle cx="11" cy="13" r="1.1" fill="rgba(255,255,255,0.35)" />
            <defs>
              <linearGradient id="planet-fill" x1="8" y1="9" x2="20" y2="22" gradientUnits="userSpaceOnUse">
                <stop stop-color="#7C3AED" />
                <stop offset="1" stop-color="#22D3EE" />
              </linearGradient>
              <linearGradient id="ring-stroke" x1="3" y1="15" x2="25" y2="15" gradientUnits="userSpaceOnUse">
                <stop stop-color="#A78BFA" stop-opacity="0.9" />
                <stop offset="1" stop-color="#22D3EE" stop-opacity="0.7" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="toast-content">
          <p class="toast-kicker">Gentle reminder</p>
          <p id="toast-text" class="toast-text"></p>
        </div>
      </div>
    </div>
  </body>
</html>
