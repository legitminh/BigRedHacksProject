<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Waypoint logo">
  <rect width="512" height="512" fill="#0b1c24"/>
  <defs>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F8EF"/>
      <stop offset="0.6" stop-color="#EBEDE1"/>
      <stop offset="1" stop-color="#D9DCCD"/>
    </linearGradient>
    <linearGradient id="nose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0B97E"/>
      <stop offset="1" stop-color="#D99769"/>
    </linearGradient>
    <linearGradient id="flameOuter" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#F6BE70"/>
      <stop offset="1" stop-color="#F08A5D"/>
    </linearGradient>
    <clipPath id="hullClip">
      <path d="M60 60 C92 48 130 50 152 62 C162 67 170 72 176 76 C170 80 162 85 152 90 C130 102 92 104 60 92 Z"/>
    </clipPath>
  </defs>
  <g transform="translate(256 256) rotate(-18) scale(2.9) translate(-98 -76)">
      <!-- flame: single torch -->
      <path d="M62 64 C50 64 38 69 22 76 C38 83 50 88 62 88 Z" fill="url(#flameOuter)"/>
      <path d="M62 69.5 C54 69.5 46 72.5 38 76 C46 79.5 54 82.5 62 82.5 Z" fill="#FAE9BC"/>
      <!-- fins (behind hull) -->
      <path d="M74 61 L82 38 Q85 32 92 33.5 C102 36 112 45 122 57 Z" fill="#D99769"/>
      <path d="M74 91 L82 114 Q85 120 92 118.5 C102 116 112 107 122 95 Z" fill="#C9845A"/>
      <!-- hull -->
      <path d="M60 60 C92 48 130 50 152 62 C162 67 170 72 176 76 C170 80 162 85 152 90 C130 102 92 104 60 92 Z" fill="url(#hull)"/>
      <g clip-path="url(#hullClip)">
        <!-- belly shade -->
        <path d="M50 85 C92 97 138 94 180 76 L180 112 L50 112 Z" fill="#A1C7BF"/>
        <!-- top highlight -->
        <path d="M70 60 C98 52 126 53 146 61" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
        <!-- nose cone with curved seam -->
        <path d="M146 46 Q138 76 146 106 L182 106 L182 46 Z" fill="url(#nose)"/>
        <path d="M146 46 Q138 76 146 106" fill="none" stroke="#B9774F" stroke-width="2" opacity="0.6"/>
        <!-- nose highlight -->
        <path d="M150 64 C158 67 165 71 170 74.5" fill="none" stroke="#FFE2B8" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/>
      </g>
      <!-- tail ring -->
      <rect x="56" y="58" width="10" height="36" rx="4" fill="#496B73"/>
      <!-- porthole -->
      <circle cx="120" cy="73" r="15.5" fill="#446A75"/>
      <circle cx="120" cy="73" r="11.5" fill="#8DDFD2"/>
      <path d="M113 70 Q115 65.5 120.5 64.5" fill="none" stroke="#F0F6D9" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
