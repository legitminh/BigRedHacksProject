# Copy to secrets.toml and fill before `npm run app:dev` / `npm run app:build`.
# secrets.toml is gitignored and gets compiled into the Mac app.
#
# REQUIRED: gemini_api_key — the project will not compile without it
#            (or a non-empty GEMINI_API_KEY env var).
# Optional:  presage_api_key — enables webcam stress / HR-RR during lock-in
# Optional:  google_client_id / google_client_secret — Sign in with Google (desktop client)
# Optional:  coach via Waypoint API (recommended — no Ollama on the user Mac):
#            Run ../BigRedHacksProjectBackend with Ollama + COACH_API_TOKEN,
#            then set local_llm_base + matching coach_api_token below.

gemini_api_key = "YOUR_GEMINI_API_KEY"
gemini_model = "gemini-flash-latest"
presage_api_key = ""
google_client_id = ""
google_client_secret = ""

# Waypoint API (sibling: https://github.com/legitminh/BigRedHacksProjectBackend)
waypoint_api_base = "http://127.0.0.1:8787"
# Coach proxy — Ollama runs on the API host, not the end-user Mac.
local_llm_base = "http://127.0.0.1:8787/v1/coach"
local_llm_model = "qwen2.5:0.5b"
local_vision_model = "moondream"
# Must match COACH_API_TOKEN in the backend .env
coach_api_token = ""
