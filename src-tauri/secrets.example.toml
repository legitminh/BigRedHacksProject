# Copy to secrets.toml before `npm run app:dev` / `npm run app:build`.
# secrets.toml is gitignored and gets compiled into the Mac app.
#
# SECURITY — do NOT put Gemini, xAI/Grok, or Google client secrets here.
# Those live only on the Waypoint API server (.env). End users sign in with Google;
# the app calls the API with a JWT. Anything baked into the .app can be extracted.
# Study heads-up voice uses POST /v1/voice/tts on the API (XAI_API_KEY server-side);
# the Mac falls back to system `say` if that path is unavailable.
#
# Point at ANY API host by setting both bases to that origin (no trailing slash):
#   Local:  http://127.0.0.1:8787   → npm run app:dev (or app:build:debug)
#   Prod:   https://api.example.com → npm run app:build (sets WAYPOINT_RELEASE=1)
# `WAYPOINT_RELEASE=1` refuses empty / localhost / http:// waypoint_api_base.
# Rebuild after changing these. Full server setup: backend DEPLOY.md
#
# Leave empty for release builds (non-empty fails `cargo build --release`).
# Optional debug-only: presage_api_key / coach_api_token — extractable if set; prefer JWT.

waypoint_api_base = "http://127.0.0.1:8787"

# Coach proxy — lock-in local inference (Ollama/Llama on the API host, never Gemini).
# Keep this on the same origin as waypoint_api_base + "/v1/coach".
# Toggle on/off with env LOCAL_LLM_ENABLED=0|1 (default on).
# Copilot chat provider is server-side: LOCAL_CHAT_PROVIDER=ollama|gemini on the API .env.
local_llm_base = "http://127.0.0.1:8787/v1/coach"
local_llm_model = "qwen2.5:0.5b"
local_vision_model = "moondream"
# Optional shared coach token (dev). Prefer Google sign-in JWT in production.
coach_api_token = ""

# Optional Presage (webcam). Leave empty if unused.
presage_api_key = ""
